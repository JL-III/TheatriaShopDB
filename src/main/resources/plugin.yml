name: ShopDB
main: com.playtheatria.shopdb.ShopDBPlugin
version: '4.2.0'
api-version: '1.21'
description: Self-hosted ShopDB - serves the shop browser website and API from the game server, and records chest shop events
author: Theatria
softdepend: [ChestShop, WorldGuard, Lands]

commands:
  shopdb:
    description: Publish or unpublish a player shop location
    usage: |
      /<command> <list/unlist>
      /<command> <list/unlist> (market-stall) [admin]
      /<command> reload
      /<command> rescan (cancel)
  shopdbedit:
    description: Bolt on command to edit shops that didn't get removed with worldedit chest deletions
    usage: |
      /<command> delete x y z

permissions:
  theatria.shopdb.admin:
    description: Allows managing ShopDB market stalls, services, and shop deletions
    default: op
