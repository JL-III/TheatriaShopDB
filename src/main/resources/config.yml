# Port the embedded HTTP server listens on (serves the website at / and the API at /api/v3).
port: 8080

# Username of the row in the `users` table whose bcrypt password hash authenticates
# POST /chest-shops and PUT/DELETE /regions (the ShopDB-Updater plugin's API key).
api-username: updater

# The API key itself. When set, the plugin writes/updates the bcrypt hash for
# api-username on startup, so no manual database seeding is needed. Use the same
# value the ShopDB-Updater plugin sends. Leave empty to manage the users table
# externally (e.g. when the row comes from an imported production dump).
api-key: ''

# SQLite database file, relative to this plugin's data folder.
database-file: shopdb.db

# The shop event updater: listens to ChestShop events (create/destroy/transaction/
# restock), buffers them in shop_events.db, and posts them to this plugin's own API.
# Requires the ChestShop and WorldGuard plugins and a non-empty api-key above.
updater:
  enabled: true
  # How often (in minutes) buffered shop events are posted. The buffer is also
  # flushed on server shutdown.
  interval-minutes: 10
  # Size of the in-memory event cache.
  cache-size: 1000
  # Log HTTP requests/responses made by the updater.
  log-http: true
  # /shopdb rescan walks every shop the database knows and re-reads it from the
  # world (refreshing item names/enchantments/lore, pruning stale rows). This is
  # how many ticks it waits between chunks - higher is gentler on the server.
  rescan-pace-ticks: 4

# Floating item + text shown to a player looking at a chest shop sign (or its
# chest) from up to range-blocks away. Per-player: nobody else sees it.
shop-info-display:
  enabled: true
  # How often (in ticks) player look-targets are checked. Lower = snappier.
  scan-interval-ticks: 4
  # Max distance (blocks) at which the display appears.
  range-blocks: 5
  # How often (in ticks) the stock line refreshes while a player keeps looking.
  stock-refresh-ticks: 20
